# TDA 部署 profile：DSH 基座之上的 tda-* 插件层叠（2026-10-14 全量层叠态）。
#
# 层叠顺序（T0.0 §1，后写覆盖、按行寻址）：
#   dsh-base（DSH 发货基座，提供 session/storage/invariants 等全部底座行）
#     → 各 mode bundle → 本 TDA 层 → 用户 patch（$DSH_HOME/cordis.patch.yml）
# patch 语义（已对 DSH boot/plugin-manager/src/patch.ts 实证）：
#   `- id: <行id>` 整块替换该行 config（不合并，findLast 按 id 匹配）；`- insert:` 追加新行；
#   `disabled: true` 为既定行停用开关（writePluginEnabled 管理的用户面）。
#
# 本文件只放 TDA 层——DSH 基座行由 dsh-base bundle 提供，不拷贝（改 DSH 零行代码）。
# 行 id 约定：TDA 插件行 id = tda-<插件短名>，name = 工作区 npm 包名（plugins/<pkg>）。
# 插件自身代码（domain/service/loadChecks）不引用本文件——装配方式与层叠解耦。
#
# 启用形态分两档（随 DSH 真装配推进）：
#   - 装配期（v1）：所有行先登记占位（行位冻结、逐行启用）；
#   - 真运行：executor/planner 的自动环与 display 的 HTTP 面随主循环形态改默认启用。

- insert:
    # ── IT0 冒烟（kill -9 三场景 + 双写对账 + replay-equivalence 验收载体）──
    - id: tda-smoke
      name: tda-smoke

    # ── P0 六族（IT1–IT5：数据面 + 派发 + 工作区）──
    - id: tda-goal-state
      name: tda-goal-state
    - id: tda-task-pool
      name: tda-task-pool
    - id: tda-timeline
      name: tda-timeline
    - id: tda-context
      name: tda-context
    - id: tda-subagent-dispatch
      name: tda-subagent-dispatch
    - id: tda-workspace
      name: tda-workspace

    # ── P1（IT6–IT8：记忆/知识/元认知）──
    - id: tda-recall
      name: tda-recall
    - id: tda-knowledge
      name: tda-knowledge
    - id: tda-meta-thinking
      name: tda-meta-thinking

    # ── P2（IT9–IT11：预测/漂移/治理 + 旁路观察层）──
    - id: tda-predictor
      name: tda-predictor
    - id: tda-drift
      name: tda-drift
    - id: tda-maintenance
      name: tda-maintenance
    - id: tda-governance
      name: tda-governance
    - id: tda-coach
      name: tda-coach
    - id: tda-plugin-scout
      name: tda-plugin-scout
    - id: tda-skill-registry
      name: tda-skill-registry
    - id: tda-identity
      name: tda-identity
    - id: tda-trajectory
      name: tda-trajectory

    # ── P3（IT11–IT13：监督/工作流/安全）──
    - id: tda-supervision
      name: tda-supervision
    - id: tda-workflow
      name: tda-workflow
    - id: tda-security
      name: tda-security

    # ── P4（IT14–IT17：任务驱动产品化层）──
    # 注意：display 为纯投影层（无 domain），其 HTTP 面由 harness daemon 驱动，
    # 插件行仅注册聚合服务；graph 为纯派生层（不立族），boot 重建由装配触发。
    - id: tda-executor
      name: tda-executor
    - id: tda-planner
      name: tda-planner
    - id: tda-graph
      name: tda-graph
    - id: tda-intake
      name: tda-intake
    - id: tda-display
      name: tda-display
